services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    restart: unless-stopped
    environment:
      RAG_QDRANT_API_KEY: ${RAG_QDRANT_API_KEY:-}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        if [ -n "$$RAG_QDRANT_API_KEY" ]; then
          export QDRANT__SERVICE__API_KEY="$$RAG_QDRANT_API_KEY"
        fi
        exec ./entrypoint.sh
    volumes:
      - qdrant-storage:/qdrant/storage
    ports:
      - "127.0.0.1:${RAG_QDRANT_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 10

  rag-api:
    image: rag:1.0.0
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      RAG_HOST: 0.0.0.0
      RAG_PORT: "8080"
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_DOCUMENTS_DIR: /app/documents/rag
    ports:
      - "127.0.0.1:${RAG_API_PORT:-8080}:8080"
    volumes:
      - ./documents:/app/documents:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  rag-ingest:
    image: rag:1.0.0
    build:
      context: .
      target: runtime
    profiles: ["maintenance"]
    env_file:
      - path: ./.env
        required: false
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_DOCUMENTS_DIR: /app/documents/rag
    volumes:
      - ./documents:/app/documents:ro
    command: ["rag", "ingest"]
    depends_on:
      qdrant:
        condition: service_healthy

  rag-tests:
    image: rag-tests:1.0.0
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      RAG_QDRANT_API_KEY: ${RAG_QDRANT_API_KEY:-}
    command: ["python", "-m", "pytest", "-p", "no:cacheprovider", "--qdrant-url=http://qdrant:6333"]
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant-storage:

