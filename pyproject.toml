[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-rag"
version = "1.0.0"
description = "Standalone, auditable RAG service for the SMART/AROMA technical corpus."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6,<7",
    "qdrant-client>=1.18,<1.20",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.15,<1",
]

[project.scripts]
smart-rag = "smart_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

